<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue — Bibliothèque UNZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#1a237e,#3949ab); }
        .book-card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.07); transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-4px); }
        .book-cover { height: 110px; background: linear-gradient(135deg,#e8eaf6,#c5cae9); border-radius: 12px 12px 0 0; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="fas fa-search me-2"></i>Catalogue UNZ</span>
        <div class="d-flex gap-2">
            <a href="tableau-de-bord.html" class="btn btn-outline-light btn-sm">Mon espace</a>
            <a href="../auth/login.html" class="btn btn-outline-light btn-sm" onclick="localStorage.clear()">Déconnexion</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <!-- Recherche -->
    <div class="mb-4">
        <div class="row g-2">
            <div class="col-md-7">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Titre, auteur ou ISBN...">
                    <button class="btn btn-primary" onclick="rechercher()">Rechercher</button>
                </div>
            </div>
            <div class="col-md-3">
                <select id="filtreDisponible" class="form-select">
                    <option value="">Tous les ouvrages</option>
                    <option value="true">Disponibles uniquement</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" onclick="reinitialiser()">
                    <i class="fas fa-redo me-1"></i>Réinitialiser
                </button>
            </div>
        </div>
    </div>

    <!-- Résultats -->
    <p class="text-muted small mb-3"><span id="nbResultats">0</span> ouvrage(s) trouvé(s)</p>

    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="text-muted mt-2">Chargement du catalogue...</p>
    </div>

    <div id="gridOuvrages" class="row g-3 d-none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = 'http://localhost:8081';
const token   = localStorage.getItem('token');
const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

let ouvrages = [];

/**
 * Charge le catalogue depuis l'API backend.
 * En mode démo (sans backend), affiche des données fictives.
 */
async function chargerCatalogue(q = '', disponible = '') {
    document.getElementById('loading').classList.remove('d-none');
    document.getElementById('gridOuvrages').classList.add('d-none');

    try {
        let url = `${API_URL}/catalogue?`;
        if (q) url += `q=${encodeURIComponent(q)}&`;
        if (disponible) url += `disponible=${disponible}&`;

        const res = await fetch(url, { headers });
        if (res.ok) {
            const data = await res.json();
            ouvrages = data.content || data;
        } else {
            ouvrages = donneesDemoCatalogue();
        }
    } catch (e) {
        ouvrages = donneesDemoCatalogue();
    }

    afficherOuvrages(ouvrages);
    document.getElementById('loading').classList.add('d-none');
    document.getElementById('gridOuvrages').classList.remove('d-none');
}

function afficherOuvrages(liste) {
    document.getElementById('nbResultats').textContent = liste.length;
    const grid = document.getElementById('gridOuvrages');

    if (liste.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center py-5">
            <i class="fas fa-search fa-3x text-muted d-block mb-3 opacity-25"></i>
            <h5 class="text-muted">Aucun ouvrage trouvé</h5>
            <button class="btn btn-outline-primary" onclick="reinitialiser()">Voir tout le catalogue</button>
        </div>`;
        return;
    }

    grid.innerHTML = liste.map(o => `
        <div class="col-md-4 col-lg-3">
            <div class="card book-card h-100">
                <div class="book-cover">
                    <i class="fas fa-book fa-3x text-primary opacity-25"></i>
                </div>
                <div class="card-body d-flex flex-column p-3">
                    <h6 class="fw-bold small mb-1">${o.titre}</h6>
                    <p class="text-muted small mb-2">${o.auteur}</p>
                    <p class="text-muted small mb-2">${o.categorie?.nom || ''}</p>
                    <div class="mt-auto">
                        <div class="mb-2">
                            ${o.disponible
                                ? `<span class="badge bg-success" style="font-size:10px;">${o.nombreExemplairesDisponibles || 1} dispo.</span>`
                                : `<span class="badge bg-danger" style="font-size:10px;">Indisponible</span>`}
                        </div>
                        <div class="d-flex gap-1">
                            <button class="btn btn-outline-primary btn-sm flex-fill" style="font-size:11px;"
                                onclick="voirFiche(${o.id})">Détails</button>
                            ${o.disponible
                                ? `<button class="btn btn-primary btn-sm flex-fill" style="font-size:11px;"
                                    onclick="emprunter(${o.id})">Emprunter</button>`
                                : `<button class="btn btn-warning btn-sm flex-fill text-dark" style="font-size:11px;"
                                    onclick="reserver(${o.id})">Réserver</button>`}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

function rechercher() {
    const q = document.getElementById('searchInput').value;
    const dispo = document.getElementById('filtreDisponible').value;
    chargerCatalogue(q, dispo);
}

function reinitialiser() {
    document.getElementById('searchInput').value = '';
    document.getElementById('filtreDisponible').value = '';
    chargerCatalogue();
}

function voirFiche(id) {
    window.location.href = `../../catalogue/fiche.html?id=${id}`;
}

async function emprunter(ouvrageId) {
    if (!token) { window.location.href = '../auth/login.html'; return; }
    if (!confirm('Confirmer l\'emprunt de cet ouvrage ?')) return;
    try {
        const res = await fetch(`${API_URL}/api/emprunts`, {
            method: 'POST', headers,
            body: JSON.stringify({ ouvrageId })
        });
        if (res.ok) {
            alert('Emprunt créé ! Vous recevrez un email de confirmation.');
            chargerCatalogue();
        } else {
            const err = await res.json();
            alert(err.message || 'Impossible de créer l\'emprunt.');
        }
    } catch (e) { alert('Mode démo : emprunt simulé.'); }
}

async function reserver(ouvrageId) {
    if (!token) { window.location.href = '../auth/login.html'; return; }
    if (!confirm('Confirmer la réservation de cet ouvrage ?')) return;
    try {
        const res = await fetch(`${API_URL}/api/reservations`, {
            method: 'POST', headers,
            body: JSON.stringify({ ouvrageId })
        });
        if (res.ok) {
            alert('Réservation créée ! Vous serez notifié quand l\'ouvrage sera disponible.');
        } else {
            const err = await res.json();
            alert(err.message || 'Impossible de créer la réservation.');
        }
    } catch (e) { alert('Mode démo : réservation simulée.'); }
}

function donneesDemoCatalogue() {
    return [
        { id:1, titre:'Introduction au Génie Logiciel', auteur:'Ian Sommerville', disponible:true, nombreExemplairesDisponibles:3, categorie:{nom:'Informatique'} },
        { id:2, titre:'Design Patterns — GoF', auteur:'Erich Gamma et al.', disponible:false, nombreExemplairesDisponibles:0, categorie:{nom:'Informatique'} },
        { id:3, titre:'Algorithmes en Java', auteur:'Robert Sedgewick', disponible:true, nombreExemplairesDisponibles:2, categorie:{nom:'Informatique'} },
        { id:4, titre:'Les Soleils des Indépendances', auteur:'Ahmadou Kourouma', disponible:true, nombreExemplairesDisponibles:1, categorie:{nom:'Littérature'} },
        { id:5, titre:'Analyse Mathématique T1', auteur:'Walter Rudin', disponible:false, nombreExemplairesDisponibles:0, categorie:{nom:'Mathématiques'} },
        { id:6, titre:'Bases de données relationnelles', auteur:'C.J. Date', disponible:true, nombreExemplairesDisponibles:2, categorie:{nom:'Informatique'} },
    ];
}

// Charger le catalogue au démarrage
chargerCatalogue();
document.getElementById('searchInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') rechercher();
});
</script>
</body>
</html>
