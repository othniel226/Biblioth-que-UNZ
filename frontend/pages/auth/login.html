<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Bibliothèque UNZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg,#1a237e 0%,#3949ab 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border-radius: 20px; box-shadow: 0 24px 64px rgba(0,0,0,0.3); }
        .brand-icon { width: 72px; height: 72px; background: linear-gradient(135deg,#1a237e,#3949ab); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .form-control { border-radius: 12px; padding: 13px 16px; border: 1.5px solid #e0e0e0; }
        .form-control:focus { border-color: #3949ab; box-shadow: 0 0 0 3px rgba(57,73,171,0.15); }
        .btn-login { background: linear-gradient(135deg,#1a237e,#3949ab); border: none; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 15px; }
        .btn-login:hover { opacity: 0.92; transform: translateY(-1px); }
        .input-group-text { border-radius: 12px 0 0 12px; border: 1.5px solid #e0e0e0; border-right: none; background: #f8f9fa; }
        .input-group .form-control { border-radius: 0 12px 12px 0; border-left: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card border-0">
                <div class="card-body p-5">
                    <div class="brand-icon">
                        <i class="fas fa-book-open fa-2x text-white"></i>
                    </div>
                    <h4 class="text-center fw-bold text-primary mb-1">Bibliothèque UNZ</h4>
                    <p class="text-center text-muted small mb-4">Université Norbert Zongo — Koudougou</p>

                    <!-- Message d'erreur (affiché via JavaScript) -->
                    <div id="erreurMsg" class="alert alert-danger d-none" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span id="erreurTexte">Email ou mot de passe incorrect.</span>
                    </div>
                    <div id="successMsg" class="alert alert-success d-none" role="alert">
                        <i class="fas fa-check-circle me-2"></i>Connexion réussie !
                    </div>

                    <!-- Formulaire -->
                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Adresse email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="email" class="form-control"
                                       placeholder="votre.email@unz.bf" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="password" class="form-control"
                                       placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-login btn-primary w-100 text-white" id="btnLogin">
                            <span id="btnText"><i class="fas fa-sign-in-alt me-2"></i>Se connecter</span>
                            <span id="btnLoad" class="d-none">
                                <span class="spinner-border spinner-border-sm me-2"></span>Connexion...
                            </span>
                        </button>
                    </form>

                    <!-- Comptes de test -->
                    <div class="mt-4 p-3 rounded-3" style="background:#f8f9fa;">
                        <p class="small fw-bold text-muted mb-2"><i class="fas fa-info-circle me-1"></i>Comptes de test :</p>
                        <div class="small text-muted">
                            <div class="mb-1"><i class="fas fa-user-shield text-danger me-1"></i>admin@bibliotheque-unz.bf</div>
                            <div class="mb-1"><i class="fas fa-book text-primary me-1"></i>alice.kabore@bibliotheque-unz.bf</div>
                            <div class="mb-1"><i class="fas fa-user-graduate text-success me-1"></i>moussa.ouedraogo@etud.unz.bf</div>
                            <div class="mt-1 fw-semibold"><i class="fas fa-key text-warning me-1"></i>Mot de passe : <code>password</code></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/**
 * Gestion du formulaire de connexion.
 * Envoie les credentials au backend Spring Boot via POST /api/auth/login
 * et stocke le token JWT retourné dans localStorage.
 */
const API_URL = 'http://localhost:8081';

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Validation basique côté client
    if (!email || !password) {
        afficherErreur('Veuillez remplir tous les champs.');
        return;
    }

    // Afficher le spinner de chargement
    document.getElementById('btnText').classList.add('d-none');
    document.getElementById('btnLoad').classList.remove('d-none');
    document.getElementById('btnLogin').disabled = true;

    try {
        const response = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, motDePasse: password })
        });

        if (response.ok) {
            const data = await response.json();

            // Stocker le token JWT et les infos utilisateur
            localStorage.setItem('token', data.token);
            localStorage.setItem('role',  data.role);
            localStorage.setItem('email', data.email);
            localStorage.setItem('nom',   data.nomComplet);

            // Afficher le succès puis rediriger selon le rôle
            document.getElementById('successMsg').classList.remove('d-none');
            setTimeout(() => {
                switch(data.role) {
                    case 'ROLE_ADMINISTRATEUR':
                        window.location.href = '../admin/tableau-de-bord.html';
                        break;
                    case 'ROLE_BIBLIOTHECAIRE':
                        window.location.href = '../bibliothecaire/tableau-de-bord.html';
                        break;
                    default:
                        window.location.href = '../etudiant/tableau-de-bord.html';
                }
            }, 800);
        } else {
            const err = await response.json();
            afficherErreur(err.message || 'Email ou mot de passe incorrect.');
        }
    } catch (error) {
        // Si le backend n'est pas lancé, redirection directe (mode démo)
        console.warn('Backend non disponible, mode démo');
        localStorage.setItem('role', 'ROLE_ETUDIANT');
        window.location.href = '../etudiant/tableau-de-bord.html';
    } finally {
        document.getElementById('btnText').classList.remove('d-none');
        document.getElementById('btnLoad').classList.add('d-none');
        document.getElementById('btnLogin').disabled = false;
    }
});

function afficherErreur(message) {
    const el = document.getElementById('erreurMsg');
    document.getElementById('erreurTexte').textContent = message;
    el.classList.remove('d-none');
    setTimeout(() => el.classList.add('d-none'), 4000);
}
</script>
</body>
</html>
