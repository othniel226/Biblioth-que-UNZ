<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retours &amp; Pénalités — Bibliothèque UNZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#0d47a1,#1565c0); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a href="tableau-de-bord.html" class="navbar-brand"><i class="fas fa-arrow-left me-2"></i>Retour</a>
    </div>
</nav>
<div class="container py-4">
    <h4 class="fw-bold mb-4"><i class="fas fa-undo me-2 text-warning"></i>Retours &amp; Pénalités</h4>
    <div id="msg" class="d-none"></div>

    <div class="row g-4">
        <!-- Scanner retour -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4">
                <h6 class="fw-bold mb-3"><i class="fas fa-barcode me-2 text-primary"></i>Enregistrer un retour</h6>
                <div class="mb-3">
                    <label class="form-label">Code-barres de l'exemplaire</label>
                    <div class="input-group">
                        <input type="text" id="codeRetour" class="form-control" placeholder="Scanner ou saisir...">
                        <button class="btn btn-primary" onclick="rechercherEmprunt()">Rechercher</button>
                    </div>
                </div>
                <div id="infoRetour" class="d-none">
                    <div class="alert alert-info">
                        <strong id="titreRetour"></strong><br>
                        <span class="small">Étudiant : <span id="etudiantRetour"></span></span><br>
                        <span class="small">Retard : <span id="retardJours" class="fw-bold text-danger"></span></span><br>
                        <span class="small fw-bold text-danger" id="penaliteRetour"></span>
                    </div>
                    <button class="btn btn-success w-100" onclick="validerRetour()">
                        <i class="fas fa-check me-2"></i>Valider le retour
                    </button>
                </div>
            </div>
        </div>

        <!-- Pénalités à encaisser -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4">
                <h6 class="fw-bold mb-3"><i class="fas fa-coins me-2 text-danger"></i>Pénalités à encaisser</h6>
                <div id="listePenalites">
                    <div class="text-center text-muted py-3">
                        <div class="spinner-border spinner-border-sm text-danger"></div>
                        Chargement...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = 'http://localhost:8081';
const token   = localStorage.getItem('token');
const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
let empruntTrouve = null;

function affMsg(msg, type) {
    const el = document.getElementById('msg');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.classList.remove('d-none');
    setTimeout(() => el.classList.add('d-none'), 4000);
}

async function rechercherEmprunt() {
    const code = document.getElementById('codeRetour').value.trim();
    try {
        const res = await fetch(`${API_URL}/api/exemplaires/code/${code}/emprunt-actif`, { headers });
        if (res.ok) {
            empruntTrouve = await res.json();
            document.getElementById('titreRetour').textContent = empruntTrouve.titreOuvrage || 'Ouvrage';
            document.getElementById('etudiantRetour').textContent = empruntTrouve.nomEtudiant || '';
            const jours = empruntTrouve.joursRetard || 0;
            document.getElementById('retardJours').textContent = jours > 0 ? jours + ' jour(s)' : 'Aucun retard';
            document.getElementById('penaliteRetour').textContent = jours > 0 ? `Pénalité : ${jours * 100} FCFA` : '';
            document.getElementById('infoRetour').classList.remove('d-none');
        } else {
            affMsg('Aucun emprunt actif trouvé pour ce code-barres.', 'warning');
        }
    } catch (e) {
        // Mode démo
        empruntTrouve = { id: 1 };
        document.getElementById('titreRetour').textContent = 'Design Patterns — GoF';
        document.getElementById('etudiantRetour').textContent = 'Aliou Barry';
        document.getElementById('retardJours').textContent = '5 jour(s)';
        document.getElementById('penaliteRetour').textContent = 'Pénalité : 500 FCFA';
        document.getElementById('infoRetour').classList.remove('d-none');
    }
}

async function validerRetour() {
    if (!empruntTrouve) return;
    try {
        const res = await fetch(`${API_URL}/api/emprunts/${empruntTrouve.id}/retour`, {
            method: 'PUT', headers
        });
        if (res.ok) {
            affMsg('Retour enregistré avec succès !', 'success');
            document.getElementById('infoRetour').classList.add('d-none');
            document.getElementById('codeRetour').value = '';
        } else {
            const err = await res.json();
            affMsg(err.message || 'Erreur.', 'danger');
        }
    } catch (e) {
        affMsg('Retour enregistré (mode démo) !', 'success');
        document.getElementById('infoRetour').classList.add('d-none');
    }
}

// Pénalités démo
document.getElementById('listePenalites').innerHTML = `
    <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
        <div>
            <div class="fw-semibold small">Aliou Barry</div>
            <div class="text-muted" style="font-size:11px;">5 jours de retard</div>
        </div>
        <div class="text-end">
            <div class="fw-bold text-danger">500 FCFA</div>
            <button class="btn btn-success btn-sm mt-1" style="font-size:11px;">Encaisser</button>
        </div>
    </div>
    <div class="d-flex justify-content-between align-items-center py-2">
        <div>
            <div class="fw-semibold small">Ibrahim Traoré</div>
            <div class="text-muted" style="font-size:11px;">3 jours de retard</div>
        </div>
        <div class="text-end">
            <div class="fw-bold text-danger">300 FCFA</div>
            <button class="btn btn-success btn-sm mt-1" style="font-size:11px;">Encaisser</button>
        </div>
    </div>
`;
</script>
</body>
</html>
