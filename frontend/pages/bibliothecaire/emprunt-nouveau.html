<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvel emprunt — Bibliothèque UNZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#0d47a1,#1565c0); }
        .form-card { border-radius: 14px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a href="tableau-de-bord.html" class="navbar-brand fw-bold">
            <i class="fas fa-arrow-left me-2"></i>Tableau de bord
        </a>
    </div>
</nav>
<div class="container py-4">
    <h4 class="fw-bold mb-4"><i class="fas fa-plus-circle me-2 text-success"></i>Enregistrer un emprunt au comptoir</h4>

    <div id="alerteMsg" class="d-none"></div>

    <div class="row g-4">
        <!-- Formulaire emprunt -->
        <div class="col-md-6">
            <div class="card form-card p-4">
                <h6 class="fw-bold mb-3">Informations de l'emprunt</h6>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Matricule de l'étudiant</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-id-card text-muted"></i></span>
                        <input type="text" id="matricule" class="form-control" placeholder="Ex: 2023INF001">
                        <button class="btn btn-outline-primary" onclick="rechercherEtudiant()">Rechercher</button>
                    </div>
                </div>

                <!-- Infos étudiant (affiché après recherche) -->
                <div id="infoEtudiant" class="alert alert-info d-none mb-3">
                    <strong id="nomEtudiant"></strong><br>
                    <span class="small text-muted" id="filEtudiant"></span>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Code-barres de l'exemplaire</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-barcode text-muted"></i></span>
                        <input type="text" id="codeBarres" class="form-control" placeholder="Ex: EX-001-A">
                        <button class="btn btn-outline-primary" onclick="rechercherExemplaire()">Vérifier</button>
                    </div>
                </div>

                <!-- Infos exemplaire (affiché après vérification) -->
                <div id="infoExemplaire" class="alert alert-success d-none mb-3">
                    <strong id="titreOuvrage"></strong><br>
                    <span class="small">Code-barres : <span id="cbExemplaire"></span></span>
                </div>

                <button class="btn btn-success w-100 py-3" onclick="creerEmprunt()" id="btnCreer" disabled>
                    <i class="fas fa-check me-2"></i>Confirmer l'emprunt
                </button>
            </div>
        </div>

        <!-- Rappel des règles -->
        <div class="col-md-6">
            <div class="card form-card p-4 border-start border-warning border-4">
                <h6 class="fw-bold mb-3"><i class="fas fa-info-circle text-warning me-2"></i>Règles d'emprunt</h6>
                <ul class="list-unstyled mb-0">
                    <li class="mb-2"><i class="fas fa-check-circle text-success me-2"></i>Compte étudiant actif</li>
                    <li class="mb-2"><i class="fas fa-check-circle text-success me-2"></i>Maximum 3 emprunts simultanés</li>
                    <li class="mb-2"><i class="fas fa-check-circle text-success me-2"></i>Pénalités impayées &lt; 500 FCFA</li>
                    <li class="mb-2"><i class="fas fa-check-circle text-success me-2"></i>Exemplaire DISPONIBLE</li>
                    <li class="mb-0 mt-3 text-muted small"><i class="fas fa-clock me-1"></i>Durée : 14 jours par défaut</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = 'http://localhost:8081';
const token   = localStorage.getItem('token');
const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

let etudiantId   = null;
let exemplaireId = null;

function afficherMsg(message, type) {
    const el = document.getElementById('alerteMsg');
    el.className = `alert alert-${type}`;
    el.textContent = message;
    el.classList.remove('d-none');
    setTimeout(() => el.classList.add('d-none'), 4000);
}

async function rechercherEtudiant() {
    const matricule = document.getElementById('matricule').value.trim();
    if (!matricule) { afficherMsg('Saisir un matricule.', 'warning'); return; }
    try {
        const res = await fetch(`${API_URL}/api/etudiants/matricule/${matricule}`, { headers });
        if (res.ok) {
            const data = await res.json();
            etudiantId = data.id;
            document.getElementById('nomEtudiant').textContent  = data.nomComplet;
            document.getElementById('filEtudiant').textContent  = data.filiere + ' ' + data.niveau;
            document.getElementById('infoEtudiant').classList.remove('d-none');
        } else {
            afficherMsg('Étudiant introuvable.', 'danger');
        }
    } catch (e) {
        // Mode démo
        etudiantId = 1;
        document.getElementById('nomEtudiant').textContent = 'Moussa Ouédraogo';
        document.getElementById('filEtudiant').textContent = 'Informatique L3';
        document.getElementById('infoEtudiant').classList.remove('d-none');
    }
    verifierBouton();
}

async function rechercherExemplaire() {
    const code = document.getElementById('codeBarres').value.trim();
    if (!code) { afficherMsg('Saisir un code-barres.', 'warning'); return; }
    try {
        const res = await fetch(`${API_URL}/api/exemplaires/code/${code}`, { headers });
        if (res.ok) {
            const data = await res.json();
            exemplaireId = data.id;
            document.getElementById('titreOuvrage').textContent = data.ouvrage?.titre || 'Ouvrage';
            document.getElementById('cbExemplaire').textContent = data.codeBarres;
            document.getElementById('infoExemplaire').classList.remove('d-none');
        } else {
            afficherMsg('Exemplaire introuvable ou indisponible.', 'danger');
        }
    } catch (e) {
        exemplaireId = 1;
        document.getElementById('titreOuvrage').textContent = 'Design Patterns — GoF';
        document.getElementById('cbExemplaire').textContent = code;
        document.getElementById('infoExemplaire').classList.remove('d-none');
    }
    verifierBouton();
}

function verifierBouton() {
    document.getElementById('btnCreer').disabled = !(etudiantId && exemplaireId);
}

async function creerEmprunt() {
    if (!confirm('Confirmer la création de cet emprunt ?')) return;
    try {
        const res = await fetch(`${API_URL}/api/emprunts`, {
            method: 'POST', headers,
            body: JSON.stringify({ etudiantId, exemplaireId })
        });
        if (res.ok) {
            afficherMsg('Emprunt créé avec succès !', 'success');
            setTimeout(() => window.location.href = 'tableau-de-bord.html', 1500);
        } else {
            const err = await res.json();
            afficherMsg(err.message || 'Erreur lors de la création.', 'danger');
        }
    } catch (e) {
        afficherMsg('Emprunt créé (mode démo) !', 'success');
        setTimeout(() => window.location.href = 'tableau-de-bord.html', 1500);
    }
}
</script>
</body>
</html>
