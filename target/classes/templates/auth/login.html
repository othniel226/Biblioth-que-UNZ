<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Bibliothèque UNZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a237e 0%, #3949ab 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .brand-icon { width: 64px; height: 64px; background: linear-gradient(135deg,#1a237e,#3949ab); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .btn-login { background: linear-gradient(135deg,#1a237e,#3949ab); border: none; border-radius: 10px; padding: 12px; font-weight: 600; }
        .btn-login:hover { background: linear-gradient(135deg,#283593,#3f51b5); transform: translateY(-1px); }
        .form-control { border-radius: 10px; padding: 12px 16px; border: 1.5px solid #e0e0e0; }
        .form-control:focus { border-color: #3949ab; box-shadow: 0 0 0 3px rgba(57,73,171,0.15); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card border-0">
                <div class="card-body p-5">
                    <!-- Logo -->
                    <div class="brand-icon">
                        <i class="fas fa-book-open fa-2x text-white"></i>
                    </div>
                    <h4 class="text-center fw-bold text-primary mb-1">Bibliothèque UNZ</h4>
                    <p class="text-center text-muted small mb-4">Université Norbert Zongo</p>

                    <!-- Messages d'erreur/succès -->
                    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Email ou mot de passe incorrect.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        Vous avez été déconnecté avec succès.
                    </div>

                    <!-- Formulaire de connexion -->
                    <!-- Spring Security traite ce formulaire via POST /auth/login -->
                    <form th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-500">Adresse email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-envelope text-muted"></i>
                                </span>
                                <input type="text" id="username" name="username"
                                       class="form-control border-start-0"
                                       placeholder="votre.email@unz.bf"
                                       required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-500">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-lock text-muted"></i>
                                </span>
                                <input type="password" id="password" name="password"
                                       class="form-control border-start-0"
                                       placeholder="••••••••"
                                       required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-login btn-primary w-100 text-white">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </form>

                    <!-- Comptes de test (à supprimer en production) -->
                    <div class="mt-4 p-3 bg-light rounded">
                        <p class="small fw-bold text-muted mb-2">Comptes de test :</p>
                        <p class="small text-muted mb-1"><i class="fas fa-user-shield text-danger me-1"></i>admin@bibliotheque-unz.bf</p>
                        <p class="small text-muted mb-1"><i class="fas fa-book text-primary me-1"></i>alice.kabore@bibliotheque-unz.bf</p>
                        <p class="small text-muted mb-0"><i class="fas fa-user-graduate text-success me-1"></i>moussa.ouedraogo@etud.unz.bf</p>
                        <p class="small text-muted mt-1"><i class="fas fa-key text-warning me-1"></i>Mot de passe : <code>password</code></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
