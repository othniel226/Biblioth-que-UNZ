spring:
  application:
    name: bibliotheque-unz

  datasource:
    url: jdbc:mysql://localhost:3306/bibliotheque_unz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Abidjan&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: BiblioHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        hbm2ddl:
          halt_on_error: false

  thymeleaf:
    encoding: UTF-8
    mode: HTML
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  mail:
    host: smtp.gmail.com
    port: 587
    username: bibliotheque.unz@gmail.com
    password:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
    default-encoding: UTF-8

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: bibliothequeUNZCleSuperSecreteChangerEnProd2026!!
    expiration-ms: 86400000
  base-url: http://localhost:8081
  bibliotheque:
    penalite-par-jour-fcfa: 100

server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /api-docs

logging:
  level:
    com.unz.bibliotheque: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{dd/MM/yyyy HH:mm:ss} [%thread] %-5level %logger{30} - %msg%n"
