<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord — Bibliothécaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#0d47a1,#1565c0) !important; }
        .action-card { border-radius: 12px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s; cursor: pointer; }
        .action-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="fas fa-book-open me-2"></i>Bibliothèque UNZ — Bibliothécaire</span>
        <div class="d-flex gap-2">
            <a href="/catalogue" class="btn btn-outline-light btn-sm"><i class="fas fa-search me-1"></i>Catalogue</a>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <h4 class="fw-bold mb-4"><i class="fas fa-tachometer-alt me-2 text-primary"></i>Tableau de bord</h4>

    <!-- Messages flash -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Actions rapides -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card action-card text-center p-4 border-start border-success border-4">
                <i class="fas fa-plus-circle fa-2x text-success mb-3"></i>
                <h6 class="fw-bold">Nouvel emprunt</h6>
                <p class="text-muted small mb-3">Enregistrer un emprunt au comptoir</p>
                <a href="/bibliothecaire/emprunts/nouveau" class="btn btn-success btn-sm">Démarrer</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card action-card text-center p-4 border-start border-warning border-4">
                <i class="fas fa-undo fa-2x text-warning mb-3"></i>
                <h6 class="fw-bold">Retour ouvrage</h6>
                <p class="text-muted small mb-3">Enregistrer le retour d'un livre</p>
                <a href="/bibliothecaire/retours" class="btn btn-warning btn-sm">Scanner</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card action-card text-center p-4 border-start border-danger border-4">
                <i class="fas fa-coins fa-2x text-danger mb-3"></i>
                <h6 class="fw-bold">Pénalités</h6>
                <p class="text-muted small mb-3">Encaisser les pénalités de retard</p>
                <a href="/bibliothecaire/penalites" class="btn btn-danger btn-sm">Gérer</a>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card action-card text-center p-4 border-start border-primary border-4">
                <i class="fas fa-books fa-2x text-primary mb-3"></i>
                <h6 class="fw-bold">Catalogue</h6>
                <p class="text-muted small mb-3">Gérer les ouvrages et exemplaires</p>
                <a href="/catalogue" class="btn btn-primary btn-sm">Gérer</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
