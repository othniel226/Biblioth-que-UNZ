<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${ouvrage.titre} + ' — Bibliothèque UNZ'">Fiche ouvrage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#1a237e,#3949ab) !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a href="/catalogue" class="navbar-brand"><i class="fas fa-arrow-left me-2"></i>Retour au catalogue</a>
    </div>
</nav>
<div class="container py-4">
    <div class="row g-4">
        <!-- Couverture -->
        <div class="col-md-3 text-center">
            <div class="rounded-3 p-5" style="background:linear-gradient(135deg,#e8eaf6,#c5cae9);">
                <i class="fas fa-book fa-5x text-primary opacity-50"></i>
            </div>
            <!-- Badge disponibilité -->
            <div class="mt-3">
                <span th:if="${ouvrage.estDisponible()}" class="badge bg-success fs-6">
                    <i class="fas fa-check-circle me-1"></i>
                    <span th:text="${ouvrage.nombreExemplairesDisponibles}"></span> exemplaire(s) disponible(s)
                </span>
                <span th:unless="${ouvrage.estDisponible()}" class="badge bg-danger fs-6">
                    <i class="fas fa-times-circle me-1"></i>Indisponible
                </span>
            </div>
        </div>

        <!-- Informations -->
        <div class="col-md-9">
            <h2 class="fw-bold" th:text="${ouvrage.titre}"></h2>
            <h5 class="text-muted" th:text="${ouvrage.auteur}"></h5>

            <div class="row g-3 my-3">
                <div class="col-sm-6" th:if="${ouvrage.isbn}">
                    <label class="text-muted small">ISBN</label>
                    <p class="fw-500" th:text="${ouvrage.isbn}"></p>
                </div>
                <div class="col-sm-6" th:if="${ouvrage.editeur}">
                    <label class="text-muted small">Éditeur</label>
                    <p class="fw-500" th:text="${ouvrage.editeur}"></p>
                </div>
                <div class="col-sm-6" th:if="${ouvrage.anneePublication}">
                    <label class="text-muted small">Année</label>
                    <p class="fw-500" th:text="${ouvrage.anneePublication}"></p>
                </div>
                <div class="col-sm-6" th:if="${ouvrage.categorie}">
                    <label class="text-muted small">Catégorie</label>
                    <p class="fw-500" th:text="${ouvrage.categorie.nom}"></p>
                </div>
            </div>

            <div th:if="${ouvrage.description}" class="mb-4">
                <label class="text-muted small">Description</label>
                <p th:text="${ouvrage.description}"></p>
            </div>

            <!-- Actions -->
            <div class="d-flex gap-2">
                <a th:if="${ouvrage.estDisponible()}"
                   href="#" class="btn btn-primary">
                    <i class="fas fa-book me-2"></i>Emprunter cet ouvrage
                </a>
                <a th:unless="${ouvrage.estDisponible()}"
                   href="#" class="btn btn-warning text-dark">
                    <i class="fas fa-bookmark me-2"></i>Réserver cet ouvrage
                </a>
                <a href="/catalogue" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Retour
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
