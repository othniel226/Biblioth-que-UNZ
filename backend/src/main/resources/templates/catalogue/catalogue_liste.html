<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue — Bibliothèque UNZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#0d47a1,#1565c0) !important; }
        .ouvrage-card { border-radius: 12px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .ouvrage-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .badge-dispo { background: #e8f5e9; color: #2e7d32; }
        .badge-indispo { background: #fce4ec; color: #c62828; }
        .cover-placeholder { height: 140px; background: linear-gradient(135deg,#e8eaf6,#c5cae9); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/catalogue">
            <i class="fas fa-book-open me-2"></i>Bibliothèque UNZ
        </a>
        <div class="d-flex align-items-center gap-2">
            <span sec:authorize="isAuthenticated()" class="text-white small"
                  th:text="${utilisateur?.nomComplet ?: ''}"></span>
            <a sec:authorize="hasRole('ETUDIANT')" href="/etudiant/tableau-de-bord"
               class="btn btn-outline-light btn-sm">Mon espace</a>
            <a sec:authorize="hasRole('BIBLIOTHECAIRE')" href="/bibliothecaire/tableau-de-bord"
               class="btn btn-outline-light btn-sm">Mon espace</a>
            <a sec:authorize="hasRole('ADMINISTRATEUR')" href="/admin/tableau-de-bord"
               class="btn btn-outline-light btn-sm">Admin</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/auth/logout}"
               class="btn btn-outline-light btn-sm">
                <i class="fas fa-sign-out-alt"></i>
            </a>
            <a sec:authorize="!isAuthenticated()" href="/auth/login"
               class="btn btn-light btn-sm">Connexion</a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Barre de recherche -->
    <form method="get" action="/catalogue" class="mb-4">
        <div class="row g-2">
            <div class="col-md-6">
                <input type="text" name="q" class="form-control form-control-lg"
                       placeholder="Rechercher par titre, auteur, ISBN..."
                       th:value="${q}">
            </div>
            <div class="col-md-3">
                <select name="categorieId" class="form-select form-select-lg">
                    <option value="">Toutes les catégories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.nom}"
                            th:selected="${cat.id == categorieId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="disponible" class="form-select form-select-lg">
                    <option value="">Tous</option>
                    <option value="true" th:selected="${disponible == true}">Disponibles</option>
                    <option value="false" th:selected="${disponible == false}">Empruntés</option>
                </select>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </form>

    <!-- Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Résultats -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">
            <span th:text="${ouvrages.totalElements}">0</span> ouvrage(s) trouvé(s)
        </h5>
    </div>

    <!-- Grille des ouvrages -->
    <div class="row g-3">
        <div th:if="${ouvrages.isEmpty()}" class="col-12 text-center py-5 text-muted">
            <i class="fas fa-book-open fa-3x mb-3 d-block opacity-25"></i>
            Aucun ouvrage trouvé.
        </div>
        <div th:each="ouvrage : ${ouvrages}" class="col-sm-6 col-md-4 col-lg-3">
            <div class="card ouvrage-card h-100">
                <div class="card-body d-flex flex-column p-3">
                    <!-- Couverture -->
                    <div class="cover-placeholder mb-3" th:if="${ouvrage.imageCouverture == null}">
                        <i class="fas fa-book fa-2x text-primary opacity-40"></i>
                    </div>
                    <img th:if="${ouvrage.imageCouverture != null}"
                         th:src="${ouvrage.imageCouverture}"
                         class="img-fluid rounded mb-3" style="height:140px;object-fit:cover;" alt="">

                    <!-- Infos -->
                    <div class="mb-1">
                        <span th:if="${ouvrage.estDisponible()}"
                              class="badge badge-dispo small">Disponible</span>
                        <span th:unless="${ouvrage.estDisponible()}"
                              class="badge badge-indispo small">Emprunté</span>
                    </div>
                    <h6 class="fw-bold mb-1 flex-grow-1" style="font-size:14px;"
                        th:text="${ouvrage.titre}">Titre</h6>
                    <p class="text-muted small mb-1" th:text="${ouvrage.auteur}">Auteur</p>
                    <p class="text-muted small mb-3"
                       th:text="${ouvrage.categorie?.nom ?: 'Non classé'}">Catégorie</p>

                    <!-- Boutons action (selon rôle) -->
                    <div class="mt-auto d-grid gap-1">
                        <a th:href="@{/catalogue/{id}(id=${ouvrage.id})}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-eye me-1"></i>Voir détails
                        </a>

                        <!-- Bouton Emprunter (étudiant, ouvrage disponible) -->
                        <form th:if="${ouvrage.estDisponible()}"
                              sec:authorize="hasRole('ETUDIANT')"
                              th:action="@{/catalogue/{id}/emprunter(id=${ouvrage.id})}"
                              method="post">
                            <button type="submit" class="btn btn-success btn-sm w-100">
                                <i class="fas fa-hand-holding-heart me-1"></i>Emprunter
                            </button>
                        </form>

                        <!-- Bouton Réserver (étudiant, ouvrage indisponible) -->
                        <form th:unless="${ouvrage.estDisponible()}"
                              sec:authorize="hasRole('ETUDIANT')"
                              th:action="@{/catalogue/{id}/reserver(id=${ouvrage.id})}"
                              method="post">
                            <button type="submit" class="btn btn-warning btn-sm w-100">
                                <i class="fas fa-bookmark me-1"></i>Réserver
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${ouvrages.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pageActuelle == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/catalogue(q=${q},categorieId=${categorieId},disponible=${disponible},page=${pageActuelle-1})}">
                    Précédent
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, ouvrages.totalPages-1)}"
                th:classappend="${i == pageActuelle} ? 'active'">
                <a class="page-link"
                   th:href="@{/catalogue(q=${q},categorieId=${categorieId},disponible=${disponible},page=${i})}"
                   th:text="${i+1}">1</a>
            </li>
            <li class="page-item" th:classappend="${pageActuelle == ouvrages.totalPages-1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/catalogue(q=${q},categorieId=${categorieId},disponible=${disponible},page=${pageActuelle+1})}">
                    Suivant
                </a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
