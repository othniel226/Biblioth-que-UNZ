<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration — Bibliothèque UNZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#212121,#424242) !important; }
        .action-card { border-radius: 12px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .action-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="fas fa-cogs me-2"></i>Bibliothèque UNZ — Administration</span>
        <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt"></i></a>
    </div>
</nav>
<div class="container py-4">
    <h4 class="fw-bold mb-4"><i class="fas fa-shield-alt me-2 text-dark"></i>Tableau de bord Administrateur</h4>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card action-card p-4 border-start border-primary border-4">
                <i class="fas fa-users fa-2x text-primary mb-3"></i>
                <h6 class="fw-bold">Gérer les utilisateurs</h6>
                <p class="text-muted small">Créer, activer, désactiver des comptes</p>
                <a href="/admin/utilisateurs" class="btn btn-primary btn-sm">Gérer</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card action-card p-4 border-start border-success border-4">
                <i class="fas fa-chart-bar fa-2x text-success mb-3"></i>
                <h6 class="fw-bold">Rapports &amp; Statistiques</h6>
                <p class="text-muted small">Ouvrages populaires, emprunts, retards</p>
                <a href="/admin/rapports" class="btn btn-success btn-sm">Voir</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card action-card p-4 border-start border-warning border-4">
                <i class="fas fa-sliders-h fa-2x text-warning mb-3"></i>
                <h6 class="fw-bold">Configuration système</h6>
                <p class="text-muted small">Durée emprunt, pénalités, quotas</p>
                <a href="/admin/configuration" class="btn btn-warning btn-sm">Configurer</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
