<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail utilisateur — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#212121,#424242) !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a href="/admin/utilisateurs" class="navbar-brand fw-bold">
            <i class="fas fa-arrow-left me-2"></i>Retour aux utilisateurs
        </a>
        <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm">Déconnexion</a>
    </div>
</nav>
<div class="container py-4">
    <div class="card border-0 shadow-sm" style="border-radius:14px; max-width:600px;">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-4">
                <i class="fas fa-user me-2 text-primary"></i>Détail de l'utilisateur
            </h5>
            <table class="table table-borderless">
                <tr>
                    <td class="text-muted fw-semibold" style="width:40%">Nom complet</td>
                    <td th:text="${utilisateur.nomComplet}"></td>
                </tr>
                <tr>
                    <td class="text-muted fw-semibold">Email</td>
                    <td th:text="${utilisateur.email}"></td>
                </tr>
                <tr>
                    <td class="text-muted fw-semibold">Rôle</td>
                    <td>
                        <span th:switch="${utilisateur.role.name()}">
                            <span th:case="'ADMINISTRATEUR'" class="badge bg-danger">Administrateur</span>
                            <span th:case="'BIBLIOTHECAIRE'" class="badge bg-primary">Bibliothécaire</span>
                            <span th:case="*" class="badge bg-success">Étudiant</span>
                        </span>
                    </td>
                </tr>
                <tr>
                    <td class="text-muted fw-semibold">Statut</td>
                    <td>
                        <span th:if="${utilisateur.actif}" class="badge bg-success">Actif</span>
                        <span th:unless="${utilisateur.actif}" class="badge bg-secondary">Désactivé</span>
                    </td>
                </tr>
                <tr>
                    <td class="text-muted fw-semibold">Date création</td>
                    <td th:text="${utilisateur.dateCreation}"></td>
                </tr>
            </table>
            <div class="d-flex gap-2 mt-3">
                <form th:if="${utilisateur.actif}" th:action="@{/admin/utilisateurs/{id}/desactiver(id=${utilisateur.id})}" method="post">
                    <button type="submit" class="btn btn-warning btn-sm">Désactiver</button>
                </form>
                <form th:unless="${utilisateur.actif}" th:action="@{/admin/utilisateurs/{id}/activer(id=${utilisateur.id})}" method="post">
                    <button type="submit" class="btn btn-success btn-sm">Activer</button>
                </form>
                <a href="/admin/utilisateurs" class="btn btn-outline-secondary btn-sm">Retour</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
