<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configuration — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a href="/admin/tableau-de-bord" class="navbar-brand">← Administration</a>
    </div>
</nav>
<div class="container py-4">
    <h4 class="fw-bold mb-4">Configuration système</h4>
    <div class="card">
        <div class="card-body">
            <table class="table">
                <thead><tr><th>Clé</th><th>Valeur</th><th>Action</th></tr></thead>
                <tbody>
                    <tr th:each="cfg : ${configurations}">
                        <td th:text="${cfg.cle}"></td>
                        <td th:text="${cfg.valeur}"></td>
                        <td>
                            <form th:action="@{/admin/configuration}" method="post" class="d-flex gap-2">
                                <input type="hidden" name="cle" th:value="${cfg.cle}">
                                <input type="text" name="valeur" class="form-control form-control-sm" th:value="${cfg.valeur}">
                                <button class="btn btn-primary btn-sm">Modifier</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
