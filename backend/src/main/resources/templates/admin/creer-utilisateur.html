<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un utilisateur — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#212121,#424242) !important; }
        .form-card { border-radius: 14px; border: none; box-shadow: 0 2px 16px rgba(0,0,0,0.10); }
        .form-control, .form-select { border-radius: 10px; padding: 11px 14px; }
        .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #3949ab; letter-spacing: 1px; border-bottom: 2px solid #e8eaf6; padding-bottom: 8px; margin-bottom: 16px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a href="/admin/utilisateurs" class="navbar-brand fw-bold">
            <i class="fas fa-arrow-left me-2"></i>Gestion des utilisateurs
        </a>
        <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm">Déconnexion</a>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card form-card p-4">
                <h5 class="fw-bold mb-4">
                    <i class="fas fa-user-plus me-2 text-primary"></i>Créer un nouvel utilisateur
                </h5>

                <!-- Messages -->
                <div th:if="${success}" class="alert alert-success">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                </div>

                <form th:action="@{/admin/utilisateurs/creer}" method="post">

                    <!-- Type de compte -->
                    <div class="section-title">Type de compte</div>
                    <div class="mb-4">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <div class="form-check border rounded-3 p-3 text-center" style="cursor:pointer;"
                                     onclick="document.getElementById('roleEtudiant').checked=true; toggleChamps('etudiant')">
                                    <input class="form-check-input" type="radio" name="role"
                                           id="roleEtudiant" value="ETUDIANT" checked>
                                    <label class="form-check-label d-block mt-1" for="roleEtudiant">
                                        <i class="fas fa-user-graduate fa-2x text-success d-block mb-2"></i>
                                        <strong>Étudiant</strong>
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check border rounded-3 p-3 text-center" style="cursor:pointer;"
                                     onclick="document.getElementById('roleBiblio').checked=true; toggleChamps('bibliothecaire')">
                                    <input class="form-check-input" type="radio" name="role"
                                           id="roleBiblio" value="BIBLIOTHECAIRE">
                                    <label class="form-check-label d-block mt-1" for="roleBiblio">
                                        <i class="fas fa-book fa-2x text-primary d-block mb-2"></i>
                                        <strong>Bibliothécaire</strong>
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check border rounded-3 p-3 text-center" style="cursor:pointer;"
                                     onclick="document.getElementById('roleAdmin').checked=true; toggleChamps('admin')">
                                    <input class="form-check-input" type="radio" name="role"
                                           id="roleAdmin" value="ADMINISTRATEUR">
                                    <label class="form-check-label d-block mt-1" for="roleAdmin">
                                        <i class="fas fa-user-shield fa-2x text-danger d-block mb-2"></i>
                                        <strong>Administrateur</strong>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Informations personnelles -->
                    <div class="section-title">Informations personnelles</div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Prénom *</label>
                            <input type="text" name="prenom" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Nom *</label>
                            <input type="text" name="nom" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email *</label>
                        <input type="text" name="email" class="form-control"
                               placeholder="prenom.nom@etud.unz.bf" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Mot de passe *</label>
                        <input type="password" name="motDePasse" class="form-control"
                               placeholder="Min. 6 caractères" required minlength="6">
                    </div>

                    <!-- Champs spécifiques étudiant -->
                    <div id="champsEtudiant">
                        <div class="section-title">Informations académiques</div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Matricule *</label>
                            <input type="text" name="matricule" class="form-control"
                                   placeholder="Ex: 2024INF001">
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-7">
                                <label class="form-label fw-semibold small">Filière *</label>
                                <select name="filiere" class="form-select">
                                    <option value="">Sélectionner...</option>
                                    <option value="Informatique">Informatique</option>
                                    <option value="Mathématiques">Mathématiques</option>
                                    <option value="Physique">Physique</option>
                                    <option value="Chimie">Chimie</option>
                                    <option value="Biologie">Biologie</option>
                                    <option value="Économie">Économie</option>
                                    <option value="Droit">Droit</option>
                                    <option value="Lettres">Lettres</option>
                                    <option value="Histoire">Histoire</option>
                                    <option value="Géographie">Géographie</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label fw-semibold small">Niveau *</label>
                                <select name="niveau" class="form-select">
                                    <option value="L1">L1</option>
                                    <option value="L2">L2</option>
                                    <option value="L3" selected>L3</option>
                                    <option value="M1">M1</option>
                                    <option value="M2">M2</option>
                                    <option value="D">Doctorat</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Champs spécifiques bibliothécaire -->
                    <div id="champsBiblio" class="d-none">
                        <div class="section-title">Informations bibliothécaire</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Numéro badge</label>
                                <input type="text" name="badgeNumero" class="form-control"
                                       placeholder="Ex: BIB-003">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Service</label>
                                <input type="text" name="service" class="form-control"
                                       placeholder="Ex: Section ouvrages généraux">
                            </div>
                        </div>
                    </div>

                    <!-- Boutons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-user-plus me-2"></i>Créer le compte
                        </button>
                        <a href="/admin/utilisateurs" class="btn btn-outline-secondary px-4">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleChamps(role) {
    document.getElementById('champsEtudiant').classList.add('d-none');
    document.getElementById('champsBiblio').classList.add('d-none');
    if (role === 'etudiant') document.getElementById('champsEtudiant').classList.remove('d-none');
    if (role === 'bibliothecaire') document.getElementById('champsBiblio').classList.remove('d-none');
}
</script>
</body>
</html>
