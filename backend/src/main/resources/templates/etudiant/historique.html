<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique emprunts — Bibliothèque UNZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#1b5e20,#2e7d32) !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a href="/etudiant/tableau-de-bord" class="navbar-brand fw-bold">
            <i class="fas fa-arrow-left me-2"></i>Retour au tableau de bord
        </a>
        <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm">Déconnexion</a>
    </div>
</nav>
<div class="container py-4">
    <h4 class="fw-bold mb-4">
        <i class="fas fa-history me-2 text-success"></i>
        Historique des emprunts — <span th:text="${etudiant.nomComplet}"></span>
    </h4>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Ouvrage</th>
                        <th>Auteur</th>
                        <th>Date emprunt</th>
                        <th>Retour prévu</th>
                        <th>Retour réel</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${historique.totalElements == 0}">
                        <td colspan="6" class="text-center text-muted py-4">Aucun emprunt dans l'historique.</td>
                    </tr>
                    <tr th:each="emp : ${historique.content}">
                        <td class="fw-500" th:text="${emp.exemplaire.ouvrage.titre}"></td>
                        <td class="text-muted small" th:text="${emp.exemplaire.ouvrage.auteur}"></td>
                        <td class="small" th:text="${emp.dateEmprunt}"></td>
                        <td class="small" th:text="${emp.dateRetourPrevu}"></td>
                        <td class="small" th:text="${emp.dateRetourReel != null ? emp.dateRetourReel : '—'}"></td>
                        <td>
                            <span th:switch="${emp.statut.name()}">
                                <span th:case="'RENDU'" class="badge bg-success">Rendu</span>
                                <span th:case="'EN_RETARD'" class="badge bg-danger">En retard</span>
                                <span th:case="'PROLONGE'" class="badge bg-warning text-dark">Prolongé</span>
                                <span th:case="*" class="badge bg-primary">En cours</span>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- Pagination -->
    <nav th:if="${historique.totalPages > 1}" class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${historique.first} ? disabled">
                <a class="page-link" th:href="@{/etudiant/historique(page=${historique.number - 1})}">Précédent</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="'Page ' + ${historique.number + 1} + ' / ' + ${historique.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${historique.last} ? disabled">
                <a class="page-link" th:href="@{/etudiant/historique(page=${historique.number + 1})}">Suivant</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
