<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pénalités — Bibliothécaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#0d47a1,#1565c0) !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <i class="fas fa-book-open me-2"></i>Bibliothèque UNZ — Bibliothécaire
        </span>
        <div class="d-flex gap-2">
            <a href="/bibliothecaire/tableau-de-bord" class="btn btn-outline-light btn-sm">
                <i class="fas fa-tachometer-alt me-1"></i>Tableau de bord
            </a>
            <a href="/bibliothecaire/retours" class="btn btn-outline-light btn-sm">
                <i class="fas fa-undo me-1"></i>Retours
            </a>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold">
            <i class="fas fa-coins me-2 text-warning"></i>Gestion des Pénalités
        </h4>
        <span class="badge bg-danger fs-6">
            <span th:text="${totalImpayees}">0</span> impayée(s)
        </span>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3">Étudiant</th>
                            <th>Ouvrage</th>
                            <th>Jours retard</th>
                            <th>Montant</th>
                            <th>Date création</th>
                            <th class="pe-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${penalites.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="fas fa-check-circle text-success fa-2x d-block mb-2"></i>
                                Aucune pénalité impayée !
                            </td>
                        </tr>
                        <tr th:each="pen : ${penalites}">
                            <td class="ps-3">
                                <div class="fw-semibold small"
                                     th:text="${pen.emprunt?.etudiant?.nomComplet ?: '—'}"></div>
                                <div class="text-muted" style="font-size:11px;"
                                     th:text="${pen.emprunt?.etudiant?.email ?: ''}"></div>
                            </td>
                            <td class="small"
                                th:text="${pen.emprunt?.exemplaire?.ouvrage?.titre ?: '—'}"></td>
                            <td class="text-center">
                                <span class="badge bg-danger"
                                      th:text="${pen.joursRetard + 'j'}"></span>
                            </td>
                            <td>
                                <span class="fw-bold text-danger"
                                      th:text="${pen.montant + ' FCFA'}"></span>
                            </td>
                            <td class="small text-muted" th:text="${pen.dateCreation}"></td>
                            <td class="pe-3 text-center">
                                <form th:action="@{/bibliothecaire/penalites/{id}/payer(id=${pen.id})}"
                                      method="post"
                                      onsubmit="return confirm('Confirmer l\'encaissement ?')">
                                    <button type="submit" class="btn btn-success btn-sm">
                                        <i class="fas fa-check me-1"></i>Encaisser
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
