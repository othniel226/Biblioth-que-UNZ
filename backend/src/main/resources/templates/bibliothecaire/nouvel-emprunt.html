<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvel Emprunt — Bibliothécaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#0d47a1,#1565c0) !important; }
        .form-card { border-radius: 14px; border: none; box-shadow: 0 2px 16px rgba(0,0,0,0.10); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand fw-bold">
            <i class="fas fa-book-open me-2"></i>Bibliothèque UNZ — Bibliothécaire
        </span>
        <div class="d-flex gap-2">
            <a href="/bibliothecaire/tableau-de-bord" class="btn btn-outline-light btn-sm">
                <i class="fas fa-tachometer-alt me-1"></i>Tableau de bord
            </a>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card form-card p-4">
                <h5 class="fw-bold mb-4">
                    <i class="fas fa-plus-circle me-2 text-primary"></i>Enregistrer un nouvel emprunt
                </h5>

                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/bibliothecaire/emprunts/nouveau}" method="post">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Étudiant *</label>
                        <select name="etudiantId" class="form-select" required>
                            <option value="">Sélectionner un étudiant...</option>
                            <option th:each="etudiant : ${etudiants}"
                                    th:value="${etudiant.id}"
                                    th:text="${etudiant.nomComplet + ' — ' + etudiant.matricule}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Exemplaire disponible *</label>
                        <select name="exemplaireId" class="form-select" required>
                            <option value="">Sélectionner un exemplaire...</option>
                            <option th:each="ex : ${exemplaires}"
                                    th:value="${ex.id}"
                                    th:text="${ex.ouvrage.titre + ' — ' + ex.codeBarres}">
                            </option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-save me-2"></i>Enregistrer l'emprunt
                        </button>
                        <a href="/bibliothecaire/tableau-de-bord" class="btn btn-outline-secondary px-4">
                            Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
