<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue — Bibliothèque UNZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg,#1a237e,#3949ab) !important; }
        .book-card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.07); transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .book-cover { height: 120px; background: linear-gradient(135deg,#e8eaf6,#c5cae9); display: flex; align-items: center; justify-content: center; border-radius: 12px 12px 0 0; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="fas fa-book-open me-2"></i>Catalogue UNZ</span>
        <div class="d-flex gap-2">
            <a href="/etudiant/tableau-de-bord" class="btn btn-outline-light btn-sm">Mon espace</a>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm">Déconnexion</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    <!-- Barre de recherche -->
    <form method="get" class="mb-4">
        <div class="row g-2">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" name="q" class="form-control" placeholder="Titre, auteur ou ISBN..." th:value="${q}">
                </div>
            </div>
            <div class="col-md-3">
                <select name="categorieId" class="form-select">
                    <option value="">Toutes les catégories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.nom}"
                            th:selected="${cat.id == categorieId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="disponible" class="form-select">
                    <option value="">Tous</option>
                    <option value="true" th:selected="${disponible == true}">Disponibles</option>
                </select>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </form>

    <!-- Résultats -->
    <p class="text-muted small mb-3">
        <span th:text="${ouvrages.totalElements}">0</span> ouvrage(s) trouvé(s)
    </p>

    <div class="row g-3">
        <div class="col-md-4 col-lg-3" th:each="ouvrage : ${ouvrages.content}">
            <div class="card book-card h-100">
                <div class="book-cover">
                    <i class="fas fa-book fa-3x text-primary opacity-25"></i>
                </div>
                <div class="card-body d-flex flex-column p-3">
                    <h6 class="fw-bold small mb-1 line-clamp-2" th:text="${ouvrage.titre}"></h6>
                    <p class="text-muted small mb-2" th:text="${ouvrage.auteur}"></p>
                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span th:if="${ouvrage.estDisponible()}"
                                  class="badge bg-success" style="font-size:10px;">
                                <span th:text="${ouvrage.nombreExemplairesDisponibles}"></span> dispo.
                            </span>
                            <span th:unless="${ouvrage.estDisponible()}"
                                  class="badge bg-danger" style="font-size:10px;">Indisponible</span>
                        </div>
                        <div class="d-flex gap-1">
                            <a th:href="@{/catalogue/{id}(id=${ouvrage.id})}"
                               class="btn btn-outline-primary btn-sm flex-fill" style="font-size:11px;">
                                Détails
                            </a>
                            <a th:if="${ouvrage.estDisponible()}"
                               href="#" class="btn btn-primary btn-sm flex-fill" style="font-size:11px;">
                                Emprunter
                            </a>
                            <a th:unless="${ouvrage.estDisponible()}"
                               href="#" class="btn btn-warning btn-sm flex-fill text-dark" style="font-size:11px;">
                                Réserver
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Message si aucun résultat -->
        <div th:if="${ouvrages.totalElements == 0}" class="col-12 text-center py-5">
            <i class="fas fa-search fa-3x text-muted mb-3 d-block"></i>
            <h5 class="text-muted">Aucun ouvrage trouvé</h5>
            <p class="text-muted">Essayez avec d'autres termes de recherche.</p>
            <a href="/catalogue" class="btn btn-outline-primary">Voir tout le catalogue</a>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${ouvrages.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${ouvrages.first} ? disabled">
                <a class="page-link" th:href="@{/catalogue(page=${ouvrages.number - 1}, q=${q}, categorieId=${categorieId})}">Précédent</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, ouvrages.totalPages - 1)}"
                class="page-item" th:classappend="${i == ouvrages.number} ? active">
                <a class="page-link" th:href="@{/catalogue(page=${i}, q=${q})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${ouvrages.last} ? disabled">
                <a class="page-link" th:href="@{/catalogue(page=${ouvrages.number + 1}, q=${q}, categorieId=${categorieId})}">Suivant</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
